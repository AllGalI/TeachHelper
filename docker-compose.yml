services:
  app:
    build: .
    env_file:
      - .env
    container_name: teachHelperBack
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy # Ждем полной готовности БД
      redis:
        condition: service_healthy # Ждем готовности Redis
      minio:
        condition: service_started
      celery_worker:
        condition: service_healthy
     
    deploy:
      resources:
        limits:
          memory: 512M

    volumes:
      - .:/app

  celery_worker:
    build: .
    env_file:
      - .env
    container_name: mail_worker
    command: celery -A app.workers.mail_worker.app worker --loglevel=info -c 1 --max-tasks-per-child=10
    deploy:
        resources:
          limits:
            memory: 512M
    healthcheck:
      # Команда inspect ping проверяет, отвечает ли воркер на запросы брокера
      test: ["CMD-SHELL", "celery -A app.workers.mail_worker.app inspect ping"]
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 30s

  flower:
    build: .
    command: celery -A app.workers.mail_worker.app flower --port=5555 --url_prefix=flower
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    
    healthcheck:
      # pg_isready проверяет, принимает ли база подключения
      test: ["CMD-SHELL", "pg_isready -U $$DATABASE_USER -d $$DATABASE_NAME"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:8.4.0-alpine
    container_name: redis_c
    restart: always
    env_file:
      - .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASS}
      REDIS_USER: ${REDIS_USER}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio_s3
    restart: always
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: "*" 
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data


volumes:
  pgdata:
  redis_data:
  minio_data:

